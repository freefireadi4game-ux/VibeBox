<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18113c" />
      <stop offset="50%" stop-color="#0b0e24" />
      <stop offset="100%" stop-color="#050714" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="url(#glowGrad)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Center Glowing Box / Music Soundwave Symbol -->
  <g transform="translate(106, 106)" filter="url(#neonGlow)">
    <!-- Outer rounded frame -->
    <rect x="0" y="0" width="300" height="300" rx="64" fill="#0d112d" stroke="url(#glowGrad)" stroke-width="8" />

    <!-- Audio Frequency Bars inside VibeBox -->
    <!-- Bar 1 -->
    <rect x="45" y="110" width="22" height="80" rx="11" fill="url(#waveGrad)" />
    <!-- Bar 2 -->
    <rect x="85" y="70" width="22" height="160" rx="11" fill="url(#waveGrad)" />
    <!-- Bar 3 (Center Play / Peak Bar) -->
    <rect x="125" y="40" width="22" height="220" rx="11" fill="url(#glowGrad)" />
    <!-- Bar 4 -->
    <rect x="165" y="65" width="22" height="170" rx="11" fill="url(#waveGrad)" />
    <!-- Bar 5 -->
    <rect x="205" y="100" width="22" height="100" rx="11" fill="url(#waveGrad)" />
    <!-- Bar 6 -->
    <rect x="245" y="130" width="22" height="40" rx="11" fill="url(#waveGrad)" />
  </g>

  <!-- Decorative Orbit Dot -->
  <circle cx="390" cy="120" r="10" fill="#ec4899" />
  <circle cx="120" cy="390" r="8" fill="#6366f1" />
</svg>
